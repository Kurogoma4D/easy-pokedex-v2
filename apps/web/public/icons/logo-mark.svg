<?xml version="1.0" encoding="UTF-8"?>
<!--
  Brand mark — a dot-matrix Poké Ball rendered on an integer pixel grid.
  Drawn at a 16x16 "dot" resolution (viewBox 0 0 16 16) so it stays crisp at
  small sizes and reads as pixel art. Colors reference the design tokens via
  CSS custom properties with literal fallbacks so the file also renders
  correctly when rasterized standalone (favicon / app icon generation).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     shape-rendering="crispEdges" role="img" aria-label="Easy Pokedex">
  <style>
    .ink { fill: var(--lcd-3, #1b2e1a); }
    .lit { fill: var(--lcd-0, #cfe8b0); }
    .led { fill: var(--led-power, #d83a3a); }
    .mid { fill: var(--lcd-1, #9bbc6c); }
  </style>

  <!-- outer dot-ink ring (the ball silhouette) -->
  <path class="ink" d="M5 1h6v1H5zM3 2h2v1H3zM11 2h2v1h-2zM2 3h1v2H2zM13 3h1v2h-1zM1 5h1v6H1zM14 5h1v6h-1zM2 11h1v2H2zM13 11h1v2h-1zM3 13h2v1H3zM11 13h2v1h-2zM5 14h6v1H5z"/>

  <!-- top half: lit LCD panel -->
  <path class="lit" d="M5 2h6v1H5zM3 3h10v2H3zM2 5h12v2H2zM2 7h12v1H2z"/>
  <!-- faint dot shading in the upper dome -->
  <path class="mid" d="M4 3h2v1H4zM10 4h2v1h-2z"/>

  <!-- equator band (dark), spanning the full width between the silhouette -->
  <path class="ink" d="M1 8h13v1H1z"/>

  <!-- bottom half: lit LCD panel -->
  <path class="lit" d="M2 9h12v1H2zM2 10h12v1H2zM3 11h10v1H3zM5 12h6v2H5zM5 13h6v1H5z"/>
  <path class="mid" d="M4 11h2v1H4zM10 12h2v1h-2z"/>

  <!-- center button: dark socket + red power LED core -->
  <path class="ink" d="M6 6h4v1H6zM6 9h4v1H6zM6 7h1v2H6zM9 7h1v2H9z"/>
  <path class="led" d="M7 7h2v2H7z"/>
</svg>
