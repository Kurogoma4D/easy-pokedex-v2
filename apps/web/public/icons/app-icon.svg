<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon / favicon source — the dot-matrix Poké Ball mark glowing on a lit
  green LCD screen, framed by the handheld console bezel. Mirrors the app shell
  (bezel + screen + dot texture) so the icon reads as "a Pokédex handheld".
  Drawn on a 32x32 dot grid. Colors use token values as literal fallbacks so
  standalone rasterization (favicon.ico / PNG app-icon sizes) keeps the palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     shape-rendering="crispEdges" role="img" aria-label="Easy Pokedex">
  <style>
    .ink { fill: var(--lcd-3, #1b2e1a); }
    .lit { fill: var(--lcd-0, #cfe8b0); }
    .led { fill: var(--led-power, #d83a3a); }
    .mid { fill: var(--lcd-1, #9bbc6c); }
    .shell { fill: var(--bezel-1, #c4c4cc); }
    .shell-edge { fill: var(--bezel-2, #8a8a93); }
    .dot { fill: var(--lcd-1, #9bbc6c); opacity: 0.55; }
  </style>

  <!-- handheld bezel plate -->
  <rect class="shell-edge" x="0" y="0" width="32" height="32" rx="6"/>
  <rect class="shell" x="1" y="1" width="30" height="30" rx="5"/>

  <!-- lit LCD screen inset, framed by a dark dot-ink border -->
  <rect class="ink" x="3" y="3" width="26" height="26" rx="3"/>
  <rect class="lit" x="4" y="4" width="24" height="24" rx="2"/>
  <!-- faint dot-matrix texture on the screen -->
  <g class="dot">
    <rect x="6" y="6" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/>
    <rect x="23" y="6" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/>
    <rect x="25" y="9" width="1" height="1"/><rect x="6" y="23" width="1" height="1"/>
    <rect x="9" y="25" width="1" height="1"/><rect x="23" y="25" width="1" height="1"/>
    <rect x="25" y="22" width="1" height="1"/>
  </g>

  <!-- ball mark in dark ink, centered on the screen (translate by 8,8) -->
  <g transform="translate(8,8)">
    <path class="ink" d="M5 1h6v1H5zM3 2h2v1H3zM11 2h2v1h-2zM2 3h1v2H2zM13 3h1v2h-1zM1 5h1v6H1zM14 5h1v6h-1zM2 11h1v2H2zM13 11h1v2h-1zM3 13h2v1H3zM11 13h2v1h-2zM5 14h6v1H5z"/>
    <path class="lit" d="M5 2h6v1H5zM3 3h10v2H3zM2 5h12v2H2zM2 7h12v1H2z"/>
    <path class="mid" d="M4 3h2v1H4zM10 4h2v1h-2z"/>
    <path class="ink" d="M1 8h13v1H1z"/>
    <path class="lit" d="M2 9h12v1H2zM2 10h12v1H2zM3 11h10v1H3zM5 12h6v2H5zM5 13h6v1H5z"/>
    <path class="mid" d="M4 11h2v1H4zM10 12h2v1h-2z"/>
    <path class="ink" d="M6 6h4v1H6zM6 9h4v1H6zM6 7h1v2H6zM9 7h1v2H9z"/>
    <path class="led" d="M7 7h2v2H7z"/>
  </g>
</svg>
